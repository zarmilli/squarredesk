<style>
    .hero {
      height: 100vh;
      position: relative;
      display: flex;
      overflow: hidden;
      background: var(--beige);
    }

    .hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .hero-image::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.1);
      z-index: 1;
    }

    .hero-image img {
      width: 100%;
      height: 120%;
      object-fit: cover;
      display: block;
      position: absolute;
      top: -10%;
      left: 0;
      will-change: transform;
    }

    .hero-image .hero-image-mobile {
      display: none;
    }

    .hero-text {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      flex-direction: column;
      padding: 48px;
      pointer-events: none;
    }

    .hero-text h1 {
      font-size: clamp(48px, 10.5vw, 140px);
      font-weight: 700;
      text-transform: uppercase;
      line-height: 0.95;
      letter-spacing: -0.04em;
      color: var(--white);
      margin: 0;
      width: 85vw;
      max-width: 85vw;
    }

    @media (max-width: 768px) {
      .hero {
        height: 100vh;
      }

      .hero-image img {
        height: 115%;
        top: -7.5%;
      }

      .hero-image .hero-image-desktop {
        display: none;
      }

      .hero-image .hero-image-mobile {
        display: block;
        height: 100%;
        top: 0;
        transform: none !important;
      }

      .hero-text {
        padding: 36px 24px 28px;
      }

      .hero-text h1 {
        font-size: clamp(42px, 14vw, 76px);
        width: 100%;
        max-width: 100%;
        line-height: 0.95;
      }
    }
</style>

<section id="hero" class="hero">

    <div class="hero-image">
      <img
        class="hero-image-desktop"
        data-edit="hero_image"
        src="https://static.wixstatic.com/media/c837a6_317de77fbcbd4f9ab17695112874d1c6~mv2.png/v1/fill/w_1891,h_895,fp_0.54_0.39,q_90,usm_0.66_1.00_0.01,enc_auto/weavy-Gemini%203%20(Nano%20Banana%20Pro)-2026-01-14%20at%2016_44_52.png"
        alt="Hero"
      />
      <img
        class="hero-image-mobile"
        data-edit="hero_image_mobile"
        src="https://static.wixstatic.com/media/c837a6_496693e84b2c40c789ad9ebcebd9d194~mv2.png/v1/fill/w_579,h_580,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/04%20-%20weavy-Gemini%203%20(Nano%20Banana%20Pro)-2026-01-04%20at%2013_07.png"
        alt="Hero"
      />
    </div>

    <div class="hero-text">
      <h1 data-edit="site_name">Skin That Feels Like You</h1>
    </div>

</section>

<script>
    (function () {
      const hero = document.querySelector("#hero");
      const image = hero?.querySelector(".hero-image img");

      if (!hero || !image) return;

      function updateParallax() {
        const rect = hero.getBoundingClientRect();
        const viewportHeight = window.innerHeight;

        if (rect.bottom < 0 || rect.top > viewportHeight) return;

        const progress = (viewportHeight - rect.top) / (viewportHeight + rect.height);
        const movement = (progress - 0.5) * 100;

        image.style.transform = `translate3d(0, ${movement}px, 0)`;
      }

      window.addEventListener("scroll", updateParallax, { passive: true });
      window.addEventListener("resize", updateParallax);

      updateParallax();
    })();
</script>
