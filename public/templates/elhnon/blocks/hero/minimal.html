 /* ===== HERO ===== */
 <style>
    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    .hero-image {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.3);
      z-index: 1;
    }
    .hero-text {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 600px;
      padding: 60px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hero-text h1 {
      font-size: clamp(28px, 3.5vw, 56px);
      font-weight: 500;
      text-transform: uppercase;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--white);
      margin-bottom: 22px;
    }
    .hero-text p {
      font-size: clamp(14px, 1.2vw, 16px);
      font-weight: 300;
      line-height: 1.75;
      color: var(--white);
      margin-bottom: 36px;
      max-width: 420px;
    }
    .btn-primary {
      display: inline-block;
      background: var(--green-dark);
      color: var(--white);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 14px 32px;
      border-radius: 30px;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s;
      width: fit-content;
    }
    .btn-primary:hover { background: var(--green-mid); transform: translateY(-2px); }
    @media (max-width: 768px) {
      .hero {
        height: 100vh;
      }
      .hero-text {
        max-width: 100%;
        padding: 36px 24px;
      }
      .hero-text p { margin-bottom: 24px; }
    }
 </style>

 <!-- DEFAULT HERO -->
  <section id="hero" class="hero">
    <div class="hero-image">
      <img data-edit="hero_image" src="https://images.pexels.com/photos/3685530/pexels-photo-3685530.jpeg" alt="Hero" />
    </div>
    <div class="hero-text">
      <h1 data-edit="hero_title">Skin That Feels Like You</h1>
      <p data-edit="hero_description">Clean, plant-based formulas crafted for real skin. No harsh chemicals, no compromises — just radiant, healthy skin every day.</p>
      <a href="#picks" class="btn-primary" data-edit="hero_cta_link" data-edit-role="href">
        <span data-edit="hero_cta">Shop Now</span>
      </a>
    </div>
  </section>
