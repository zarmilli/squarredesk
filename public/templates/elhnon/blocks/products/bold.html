<style>
  .products-section {
    padding: 80px 24px;
    background: var(--white);
  }

  .products-inner {
    max-width: 1100px;
    margin: 0 auto;
  }

  /* 4-column × 2-row grid */
  .products-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, auto);
    gap: 16px;
  }

  /* =========================================
     FEATURED PRODUCT
     ========================================= */

  .product-card-featured {
    grid-column: 1 / 3;
    grid-row: 1 / 3;
    position: relative;
    min-height: 100%;
    border-radius: 0px;
    overflow: hidden;
    background: var(--beige-mid);
    cursor: pointer;
  }

  .product-card-featured img {
    width: 100%;
    height: 100%;
    min-height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
  }

  .product-card-featured:hover img {
    transform: scale(1.03);
  }

  .product-card-featured::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0) 55%,
      rgba(0, 0, 0, 0.35) 100%
    );
    pointer-events: none;
  }

  .product-card-featured .card-body {
    position: absolute;
    z-index: 2;
    left: 20px;
    bottom: 20px;
    width: calc(100% - 40px);
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.28);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 0px;
    box-sizing: border-box;
  }

  .product-card-featured .product-name {
    font-size: clamp(18px, 2vw, 26px);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--white);
    line-height: 1.1;
  }

  .product-card-featured .product-price {
    font-size: 15px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.85);
  }

  /* =========================================
     STANDARD PRODUCT CARDS
     ========================================= */

  .product-card {
    position: relative;
    background: var(--white);
    border-radius: 0px;
    overflow: visible;
    cursor: pointer;
  }

  .product-card .product-link {
    display: block;
    text-decoration: none;
    color: inherit;
  }

  .product-card-image {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 0px;
    background: var(--beige-mid);
  }

  .product-card-image img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity .35s ease, transform .4s ease;
  }

  .product-card-image .primary-image { opacity: 1; }
  .product-card-image .secondary-image { opacity: 0; }

  .product-card:hover .primary-image {
    opacity: 0;
    transform: scale(1.03);
  }

  .product-card:hover .secondary-image {
    opacity: 1;
    transform: scale(1.03);
  }

  .product-card .card-body {
    padding: 12px 0 6px;
    text-align: left;
  }

  .product-card .product-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dark);
    margin-bottom: 5px;
    line-height: 1.3;
  }

  .product-card .product-price {
    font-size: 14px;
    font-weight: 700;
    color: var(--green-dark);
  }

  /* =========================================
     ADD TO CART BUTTON
     ========================================= */

  .product-add {
    position: absolute;
    z-index: 5;
    top: 10px;
    right: 10px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    border-radius: 0px;
    background: var(--white);
    color: var(--text-dark);
    font-size: 20px;
    font-weight: 400;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
  }

  .product-add:hover {
    transform: translateY(-2px);
    background: var(--green-dark);
    color: var(--white);
  }

  .product-add:active { transform: scale(0.94); }

  /* =========================================
     SKELETON LOADERS
     ========================================= */

  .product-skeleton {
    border-radius: 14px;
    overflow: hidden;
    background: var(--beige-mid, #f0ece6);
    animation: skeleton-pulse 1.4s ease-in-out infinite;
  }

  .product-skeleton.featured {
    grid-column: 1 / 3;
    grid-row: 1 / 3;
    min-height: 400px;
  }

  .product-skeleton.standard .skel-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #e0d9d0;
    border-radius: 14px;
  }

  .product-skeleton .skel-line {
    height: 12px;
    background: #e0d9d0;
    border-radius: 6px;
    margin-top: 10px;
  }

  .product-skeleton .skel-line.short { width: 50%; }
  .product-skeleton .skel-line.long  { width: 80%; }

  @keyframes skeleton-pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.5; }
  }

  /* =========================================
     EMPTY STATE
     ========================================= */

  .products-empty {
    grid-column: 1 / -1;
    padding: 60px 24px;
    text-align: center;
    color: var(--text-dark, #333);
    opacity: 0.5;
    font-size: 14px;
  }

  /* =========================================
     RESPONSIVE
     ========================================= */

  @media (max-width: 768px) {
    .products-section { padding: 60px 20px; }

    .products-grid {
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: auto;
      gap: 14px;
    }

    .product-card-featured {
      grid-column: 1 / -1;
      grid-row: auto;
      aspect-ratio: 1 / 1;
    }

    .product-card-featured img { min-height: 0; }

    .product-card-featured .card-body {
      left: 14px;
      bottom: 14px;
      width: calc(100% - 28px);
      padding: 16px;
    }

    .product-card-featured .product-name { font-size: 20px; }
    .product-card-image { aspect-ratio: 1 / 1; }

    .product-add {
      width: 32px;
      height: 32px;
      top: 8px;
      right: 8px;
    }

    .product-skeleton.featured {
      grid-column: 1 / -1;
      grid-row: auto;
      min-height: 280px;
    }
  }
</style>


<section id="picks" class="products-section">
  <div class="products-inner">
    <div class="products-grid" id="products-grid">

      <!-- Skeleton loaders shown while products fetch -->
      <div class="product-skeleton featured"></div>
      <div class="product-skeleton standard">
        <div class="skel-image"></div>
        <div class="skel-line long"></div>
        <div class="skel-line short"></div>
      </div>
      <div class="product-skeleton standard">
        <div class="skel-image"></div>
        <div class="skel-line long"></div>
        <div class="skel-line short"></div>
      </div>
      <div class="product-skeleton standard">
        <div class="skel-image"></div>
        <div class="skel-line long"></div>
        <div class="skel-line short"></div>
      </div>
      <div class="product-skeleton standard">
        <div class="skel-image"></div>
        <div class="skel-line long"></div>
        <div class="skel-line short"></div>
      </div>

    </div>
  </div>
</section>


<script>
(async () => {
  const SITE_ID     = "{{SQUARRE_SITE_ID}}";
  const SUPABASE_URL = "https://suwiamrsjmbvhceqxchp.supabase.co";
  const ANON_KEY    = "{{SQUARRE_ANON_KEY}}";

  const grid = document.getElementById("products-grid");
  if (!grid) return;

  // ── Fetch active products ordered by sort_order ──────────────
  let products = [];
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/products` +
      `?site_id=eq.${SITE_ID}` +
      `&is_active=eq.true` +
      `&order=sort_order.asc,created_at.asc`,
      {
        headers: {
          apikey: ANON_KEY,
          Authorization: `Bearer ${ANON_KEY}`,
        },
      }
    );
    if (res.ok) products = await res.json();
  } catch (err) {
    console.error("Failed to fetch products:", err);
  }

  // ── Clear skeleton loaders ───────────────────────────────────
  grid.innerHTML = "";

  // ── Empty state ──────────────────────────────────────────────
  if (!products.length) {
    grid.innerHTML = `
      <div class="products-empty">
        <p>No products available yet.</p>
      </div>`;
    return;
  }

  // ── Helper: format price ─────────────────────────────────────
  function formatPrice(price) {
    return "R" + parseFloat(price || 0).toFixed(2);
  }

  // ── Helper: safe image src with fallback ─────────────────────
  function img(src, fallback) {
    return (src && src.trim()) ? src : (fallback || "");
  }

  // ── Helper: add-to-cart button click ─────────────────────────
  function handleAddToCart(btn, product) {
    window.dispatchEvent(
      new CustomEvent("product:add-to-cart", { detail: product })
    );
    const original = btn.textContent;
    btn.textContent = "✓";
    btn.setAttribute("aria-label", "Added to cart");
    setTimeout(() => {
      btn.textContent = original;
      btn.setAttribute("aria-label", "Add product to cart");
    }, 900);
  }

  // ── Render featured card (first product) ─────────────────────
  const featured = products[0];

  const featuredEl = document.createElement("div");
  featuredEl.className = "product-card-featured";
  featuredEl.setAttribute("data-product-id", featured.id);
  featuredEl.style.cursor = "pointer";
  featuredEl.onclick = () => {
    window.location.href = `/product.html?id=${featured.id}`;
  };

  featuredEl.innerHTML = `
    <img
      src="${img(featured.cover_image)}"
      alt="${featured.name}"
      onerror="this.style.display='none'"
    />
    <div class="card-body">
      <div class="product-name">${featured.name}</div>
      <div class="product-price">${formatPrice(featured.price)}</div>
    </div>`;

  grid.appendChild(featuredEl);

  // ── Render remaining products (cards 2–5) ────────────────────
  // Show up to 4 additional products after the featured one
  const rest = products.slice(1, 5);

  rest.forEach((product) => {
    const primarySrc   = img(product.cover_image);
    const secondarySrc = img(product.secondary_image, product.cover_image);

    const card = document.createElement("div");
    card.className = "product-card";
    card.setAttribute("data-product-id", product.id);

    card.innerHTML = `
      <a class="product-link" href="/product.html?id=${product.id}">
        <div class="product-card-image">
          <img
            class="primary-image"
            src="${primarySrc}"
            alt="${product.name}"
            onerror="this.style.display='none'"
          />
          <img
            class="secondary-image"
            src="${secondarySrc}"
            alt="${product.name} alternate view"
            onerror="this.style.display='none'"
          />
          <button
            type="button"
            class="product-add"
            aria-label="Add product to cart"
          >+</button>
        </div>
        <div class="card-body">
          <div class="product-name">${product.name}</div>
          <div class="product-price">${formatPrice(product.price)}</div>
        </div>
      </a>`;

    // Wire up add-to-cart — use JS not inline onclick so
    // stopPropagation works correctly
    const btn = card.querySelector(".product-add");
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      handleAddToCart(btn, {
        id:    product.id,
        name:  product.name,
        price: product.price,
        image: primarySrc,
      });
    });

    grid.appendChild(card);
  });

  // ── If fewer than 5 products, fill remaining slots ───────────
  // with placeholder cards so the grid layout doesn't break
  const totalRendered = 1 + rest.length; // featured + rest
  const placeholdersNeeded = Math.max(0, 5 - totalRendered);

  for (let i = 0; i < placeholdersNeeded; i++) {
    const ph = document.createElement("div");
    ph.className = "product-card";
    ph.style.background = "var(--beige-mid, #f0ece6)";
    ph.style.borderRadius = "14px";
    ph.style.aspectRatio = "1 / 1";
    grid.appendChild(ph);
  }

})();
</script>
