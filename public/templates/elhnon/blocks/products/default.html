 /* ===== TOP PICKS / PRODUCTS SECTION ===== */
 <style>
    .products-section {
      padding: 80px 24px;
      background: var(--white);
    }
    .products-section h2 {
      font-size: clamp(24px, 3.5vw, 38px);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 40px;
      color: var(--text-dark);
    }
    .products-inner {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* 4-col grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    /* Featured card — full image with overlay details bottom-left */
    .product-card-featured {
      grid-column: 1 / -1;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: var(--beige-mid);
    }
    .product-card-featured img {
      width: 100%;
      aspect-ratio: 16/7;
      object-fit: cover;
      display: block;
      opacity: 0.9;
    }
    .product-card-featured .card-body {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 28px 32px;
      background: linear-gradient(to top, rgba(30,20,10,0.65) 0%, rgba(30,20,10,0) 100%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-start;
    }
    .product-card-featured .product-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dark);
      background: var(--beige);
      padding: 4px 10px;
      border-radius: 50px;
    }
    .product-card-featured .product-name {
      font-size: clamp(18px, 2.5vw, 28px);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--white);
    }
    .product-card-featured .product-price {
      font-size: 18px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
    }
    .product-card-featured .product-cta {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.75);
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      margin-top: 2px;
    }

    /* Standard card */
    .product-card {
      background: var(--white);
      border-radius: 14px;
      overflow: hidden;
    }
    .product-card img {
      width: 100%;
      aspect-ratio: 1/1.2;
      object-fit: cover;
      display: block;
    }
    .product-card .card-body {
      padding: 14px 0px 18px;
    }
    .product-card .product-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .product-card .product-price {
      font-size: 14px;
      font-weight: 700;
      color: var(--green-dark);
      margin-bottom: 8px;
    }
    .product-card .product-cta {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-mid);
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .product-card-featured img { aspect-ratio: 16/9; }
      .product-card-featured .card-body { padding: 20px 20px 24px; }
    }
 </style>
