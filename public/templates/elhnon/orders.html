<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Orders - ELHNON ODNUFMON</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --beige: #f5ede0; --beige-mid: #ede0ce; --beige-deep: #d9c4a8; --green: #e4667f; --green-dark: #311e20; --bg: #faf7f2; --text-dark: #2a2218; --text-mid: #6b5f4f; --white: #fff; --danger: #7d0610; }
    body { min-height: 100vh; background: var(--bg); color: var(--text-dark); font-family: 'Poppins', sans-serif; }
    .news-banner { background: var(--green-dark); color: var(--white); text-align: center; padding: 9px 48px; font-size: 12px; font-weight: 500; letter-spacing: .05em; }
    nav { padding: 20px 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--beige-deep); background: var(--white); }
    nav .logo { color: var(--green); font-size: 18px; font-weight: 700; text-transform: uppercase; text-decoration: none; }
    nav .nav-links { display: flex; gap: 28px; }
    nav .nav-links a { color: var(--green-dark); font-size: 13px; font-weight: 600; text-decoration: none; text-transform: uppercase; letter-spacing: .04em; }
    nav .nav-links a:hover { color: var(--green); }
    .page-shell { max-width: 1000px; margin: 0 auto; padding: 90px 24px 100px; }
    .page-heading { margin-bottom: 34px; }
    .eyebrow { margin-bottom: 10px; color: var(--green); font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
    h1 { color: var(--green-dark); font-size: clamp(32px, 5vw, 54px); font-weight: 600; line-height: 1.05; }
    .intro { max-width: 560px; margin-top: 14px; color: var(--text-mid); font-size: 15px; line-height: 1.7; }
    .state { padding: 52px 24px; border: 1px solid var(--beige-deep); border-radius: 10px; background: rgba(255,255,255,.48); text-align: center; }
    .state h2 { color: var(--green-dark); font-size: 24px; font-weight: 600; }
    .state p { max-width: 480px; margin: 12px auto 0; color: var(--text-mid); font-size: 14px; line-height: 1.7; }
    .button { display: inline-block; margin-top: 26px; padding: 13px 22px; border-radius: 4px; background: var(--green-dark); color: var(--white); font-size: 12px; font-weight: 600; text-decoration: none; text-transform: uppercase; letter-spacing: .06em; }
    .orders-list { display: grid; gap: 18px; }
    .order-card { overflow: hidden; border: 1px solid var(--beige-deep); border-radius: 10px; background: rgba(255,255,255,.62); }
    .order-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 20px 22px; border-bottom: 1px solid var(--beige-deep); }
    .order-number { color: var(--green-dark); font-size: 15px; font-weight: 600; }
    .order-date { margin-top: 4px; color: var(--text-mid); font-size: 12px; }
    .status { padding: 6px 10px; border-radius: 99px; background: var(--beige-mid); color: var(--green-dark); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: capitalize; white-space: nowrap; }
    .status.paid, .status.delivered { background: #f7d7de; color: #7d0610; }
    .status.cancelled { background: #eadbd0; color: var(--text-mid); }
    .order-body { padding: 18px 22px 22px; }
    .order-items { display: grid; gap: 12px; }
    .order-item { display: flex; align-items: center; justify-content: space-between; gap: 18px; color: var(--text-dark); font-size: 13px; }
    .item-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-meta { color: var(--text-mid); font-size: 12px; white-space: nowrap; }
    .order-total { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--beige-deep); color: var(--green-dark); font-size: 16px; font-weight: 600; }
    .loading { color: var(--text-mid); font-size: 14px; }
    footer { padding: 48px 24px 36px; background: var(--green-dark); color: rgba(255,255,255,.5); text-align: center; font-size: 13px; }
    footer a { color: rgba(255,255,255,.8); }
    @media (max-width: 700px) { .news-banner { padding: 9px 16px; font-size: 11px; } nav { padding: 17px 20px; } nav .nav-links { gap: 14px; } .page-shell { padding: 58px 16px 72px; } .order-header { align-items: flex-start; flex-direction: column; gap: 10px; } .order-item { align-items: flex-start; flex-direction: column; gap: 3px; } .item-name { max-width: 100%; white-space: normal; } }
  </style>
</head>
<body>
  <div class="news-banner">OWN THE GLOW: Free shipping on orders over R300</div>
  <nav>
    <a href="/" class="logo">Elhnon Odnufmon</a>
    <div class="nav-links"><a href="/products.html">Shop All</a><a href="/cart.html">Cart</a></div>
  </nav>

  <main class="page-shell">
    <header class="page-heading">
      <div class="eyebrow">Your account</div>
      <h1>My orders</h1>
      <p class="intro">Follow your recent purchases and keep an eye on every order from Elhnon Odnufmon.</p>
    </header>
    <section id="orders-state" class="state" aria-live="polite"><p class="loading">Loading your orders...</p></section>
    <section id="orders-list" class="orders-list" hidden></section>
  </main>

  <footer>© 2026 Elhnon Odnufmon. All rights reserved. <a href="https://squarre.vercel.app" target="_blank" rel="noopener">Made using Squarre</a></footer>

  <script>
    const SITE_ID = "{{SQUARRE_SITE_ID}}";
    const SUPABASE_URL = "https://suwiamrsjmbvhceqxchp.supabase.co";
    const ANON_KEY = "{{SQUARRE_ANON_KEY}}";
    const sessionKey = `session_${SITE_ID}`;
    const state = document.getElementById("orders-state");
    const list = document.getElementById("orders-list");

    function getSession() {
      const raw = localStorage.getItem(sessionKey);
      if (!raw) return null;
      try {
        const data = JSON.parse(raw);
        if (!data.expires_at || new Date(data.expires_at) < new Date()) {
          localStorage.removeItem(sessionKey);
          return null;
        }
        return data;
      } catch {
        localStorage.removeItem(sessionKey);
        return null;
      }
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[character]);
    }

    function formatPrice(value) {
      return "R" + Number(value || 0).toFixed(2);
    }

    function formatDate(value) {
      return value ? new Date(value).toLocaleDateString("en-ZA", { day: "2-digit", month: "short", year: "numeric" }) : "Date unavailable";
    }

    function renderOrder(order) {
      const items = Array.isArray(order.items) ? order.items : [];
      const itemMarkup = items.length
        ? items.map((item) => `
            <div class="order-item">
              <span class="item-name">${escapeHtml(item.product_name || "Product")}</span>
              <span class="item-meta">${Number(item.quantity || 0)} × ${formatPrice(item.price)}</span>
            </div>`).join("")
        : '<p class="loading">No item details available.</p>';

      return `
        <article class="order-card">
          <div class="order-header">
            <div><div class="order-number">Order #${escapeHtml(order.id.slice(0, 8).toUpperCase())}</div><div class="order-date">${formatDate(order.created_at)}</div></div>
            <span class="status ${escapeHtml(order.status)}">${escapeHtml(order.status)}</span>
          </div>
          <div class="order-body">
            <div class="order-items">${itemMarkup}</div>
            <div class="order-total"><span>Total</span><span>${formatPrice(order.total)}</span></div>
          </div>
        </article>`;
    }

    function showState(title, message, action) {
      state.hidden = false;
      state.innerHTML = `<h2>${title}</h2><p>${message}</p>${action || ""}`;
    }

    async function loadOrders() {
      const currentSession = getSession();
      if (!currentSession?.customer?.id) {
        showState("Sign in to view orders", "Your order history will appear here after you log in.", '<a class="button" href="/">Return home to log in</a>');
        return;
      }

      try {
        const params = new URLSearchParams({
          select: "id,status,total,items,created_at",
          customer_id: `eq.${currentSession.customer.id}`,
          site_id: `eq.${SITE_ID}`,
          order: "created_at.desc"
        });
        const response = await fetch(`${SUPABASE_URL}/rest/v1/orders?${params}`, { headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` } });
        if (!response.ok) throw new Error("Unable to load orders");
        const orders = await response.json();

        if (!Array.isArray(orders) || orders.length === 0) {
          showState("No orders yet", "Your next favourite find is waiting for you.", '<a class="button" href="/products.html">Shop now</a>');
          return;
        }

        state.hidden = true;
        list.hidden = false;
        list.innerHTML = orders.map(renderOrder).join("");
      } catch (error) {
        console.error(error);
        showState("Orders unavailable", "We couldn't load your order history right now. Please try again.", '<a class="button" href="/orders.html">Try again</a>');
      }
    }

    loadOrders();
  </script>
</body>
</html>
