<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title data-edit="meta_title">Elhnon Odnufmon — Skincare</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --beige:        #f5ede0;
      --beige-mid:    #ede0ce;
      --beige-deep:   #d9c4a8;
      --green:        #b8ccb0;
      --green-mid:    #9db894;
      --green-dark:   #6a8f61;
      --green-pale:   #e8f0e5;
      --bg:           #faf7f2;
      --bg-mid:       #f0e9dc;
      --text-dark:    #2a2218;
      --text-mid:     #6b5f4f;
      --white:        #ffffff;
      --black:        #0f0e0b;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text-dark);
      font-family: 'Poppins', sans-serif;
    }

    /* ===== NEWS BANNER ===== */
    .news-banner {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1100;
      background: var(--green-dark);
      color: var(--white);
      text-align: center;
      padding: 9px 48px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.05em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .news-banner a {
      color: var(--white);
      text-decoration: underline;
      text-underline-offset: 2px;
      margin-left: 8px;
    }

    /* ===== NAVBAR ===== */
    nav {
      position: fixed;
      top: 36px; left: 0; right: 0;
      z-index: 1000;
      padding: 20px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent;
      transition: background 0.35s ease, box-shadow 0.35s ease, padding 0.35s ease;
    }
    nav.scrolled {
      background: var(--white);
      box-shadow: 0 2px 20px rgba(0,0,0,0.06);
      border-bottom: 1px solid var(--green-dark);
      padding: 14px 48px;
    }
    nav .logo {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-dark);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      text-decoration: none;
      position: relative;
      z-index: 1001;
      transition: color 0.35s;
    }
    nav.scrolled .logo { color: var(--green-dark); }
    nav .nav-links { display: flex; gap: 32px; }
    nav .nav-links a {
      font-size: 18px;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--text-mid);
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: color 0.2s;
    }
    nav .nav-links a:hover { color: var(--green-dark); }
    nav.scrolled .nav-links a { color: var(--text-mid); }
    nav.scrolled .nav-links a:hover { color: var(--green-dark); }

    /* Burger */
    .burger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 36px; height: 36px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      position: relative;
      z-index: 1001;
    }
    .burger span {
      display: block;
      width: 100%; height: 2px;
      background: var(--text-dark);
      border-radius: 2px;
      transition: transform 0.3s ease, opacity 0.3s ease;
      transform-origin: center;
    }
    .burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .burger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    @media (max-width: 700px) {
      .news-banner { padding: 9px 16px; font-size: 11px; }
      nav { padding: 16px 20px; top: 34px; }
      nav.scrolled { padding: 12px 20px; top: 34px; }
      .burger { display: flex; }
      .nav-links {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 100vh;
        background: var(--beige);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        transform: translateY(-100%);
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: none;
      }
      .nav-links.open { transform: translateY(0); pointer-events: all; }
      .nav-links a {
        font-size: 22px !important;
        font-weight: 600 !important;
        color: var(--text-dark) !important;
      }
      .nav-links a:hover { color: var(--green-dark) !important; }
    }

    /* ===== FOOTER ===== */
    footer {
      background: var(--black);
      color: rgba(255,255,255,0.45);
      text-align: center;
      padding: 48px 24px 36px;
    }
    footer .footer-logo {
      font-size: 18px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: 0.02em;
      margin-bottom: 8px;
    }
    footer .footer-copy {
      font-size: 13px;
      margin-bottom: 14px;
      color: rgba(255,255,255,0.4);
    }
    footer .footer-squarre {
      font-size: 13px;
      color: rgba(255,255,255,0.3);
    }
    footer .footer-squarre a {
      color: rgba(255,255,255,0.7);
      text-decoration: underline;
      font-weight: 500;
    }
    footer .footer-squarre a:hover { color: var(--white); }
  </style>
</head>
<body>

  <!-- NEWS BANNER -->
  <div class="news-banner">
    <span data-edit="banner_text">Free shipping on all orders over R175 — limited time offer.</span>
    <a href="#picks" data-edit="banner_link" data-edit-role="href">Shop now</a>

  <script>
    // Navbar scroll
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('scrolled', window.scrollY > 60);
    });

    // Burger menu
    const burger = document.getElementById('burger');
    const navLinks = document.getElementById('navLinks');
    burger.addEventListener('click', () => {
      burger.classList.toggle('open');
      navLinks.classList.toggle('open');
    });
    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        burger.classList.remove('open');
        navLinks.classList.remove('open');

    });
