  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --beige:        #f5ede0;
      --beige-mid:    #ede0ce;
      --beige-deep:   #d9c4a8;
      --green:        #e4667f;
      --green-mid:    #9db894;
      --green-dark:   #311e20;
      --green-pale:   #e8f0e5;
      --bg:           #faf7f2;
      --bg-mid:       #f0e9dc;
      --text-dark:    #2a2218;
      --text-mid:     #6b5f4f;
      --white:        #ffffff;
      --black:        #0f0e0b;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text-dark);
      font-family: 'Poppins', sans-serif;
    }

    /* ===== NEWS BANNER ===== */
    .news-banner {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1100;
      background: var(--green-dark);
      color: var(--white);
      text-align: center;
      padding: 9px 48px;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.05em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .news-banner a {
      color: var(--white);
      text-decoration: underline;
      text-underline-offset: 2px;
      margin-left: 8px;
    }

    /* ===== NAVBAR ===== */
    nav {
      position: fixed;
      top: 36px; left: 0; right: 0;
      z-index: 1000;
      padding: 20px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent;
      transition: background 0.35s ease, box-shadow 0.35s ease, padding 0.35s ease;
    }
    nav.scrolled {
      background: var(--white);
      box-shadow: 0 2px 20px rgba(0,0,0,0.06);
      border-bottom: 1px solid var(--green-dark);
      padding: 14px 48px;
    }
    nav .logo {
      font-size: 18px;
      font-weight: 700;
      color: var(--white);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      text-decoration: none;
      position: relative;
      z-index: 1001;
      transition: color 0.35s;
    }
    nav.scrolled .logo { color: var(--green); }
    nav .nav-links { display: flex; gap: 32px; }
    nav .nav-links a {
      font-size: 18px;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--white);
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: color 0.2s;
    }
    nav .nav-links a:hover { color: var(--green-dark); }
    nav.scrolled .nav-links a { color: var(--green-dark); }
    nav.scrolled .nav-links a:hover { color: var(--green); }

    /* Burger */
    .burger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 36px; height: 36px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      position: relative;
      z-index: 1001;
    }
    .burger span {
      display: block;
      width: 100%; height: 2px;
      background: var(--green);
      border-radius: 2px;
      transition: transform 0.3s ease, opacity 0.3s ease;
      transform-origin: center;
    }
    .burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .burger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    @media (max-width: 700px) {
      .news-banner { padding: 9px 16px; font-size: 11px; }
      nav { padding: 16px 20px; top: 34px; }
      nav.scrolled { padding: 12px 20px; top: 34px; }
      .burger { display: flex; }
      .nav-links {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 100vh;
        background: var(--beige);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        transform: translateY(-100%);
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: none;
      }
      .nav-links.open { transform: translateY(0); pointer-events: all; }
      .nav-links a {
        font-size: 22px !important;
        font-weight: 600 !important;
        color: var(--text-dark) !important;
      }
      .nav-links a:hover { color: var(--green-dark) !important; }
    }

    /* ===== FOOTER ===== */
    footer {
      background: var(--green-dark);
      color: #6a0610;
      text-align: center;
      padding: 48px 24px 36px;
    }
    footer .footer-logo {
      font-size: 18px;
      font-weight: 700;
      color: var(--green);
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    footer .footer-copy {
      font-size: 13px;
      margin-bottom: 14px;
      color: rgba(255,255,255,0.4);
    }
    footer .footer-squarre {
      font-size: 13px;
      color: rgba(255,255,255,0.3);
    }
    footer .footer-squarre a {
      color: rgba(255,255,255,0.7);
      text-decoration: underline;
      font-weight: 500;
    }
    footer .footer-squarre a:hover { color: var(--white); }
  </style>
</head>
<body>

  <!-- NEWS BANNER -->
  <div class="news-banner">
    <span data-edit="banner_text">OWN THE GLOW: Free shipping on orders over R300</span>

  <!-- NAVBAR -->

  <!-- FOOTER -->

    <div class="footer-logo" data-edit="site_name">Elhnon Odnufmon</div>
    <p class="footer-copy">© <span data-edit="copyright_year">2026</span> <span data-edit="site_name">Elhnon Odnufmon</span>. All rights reserved.</p>
    <p class="footer-squarre">Want your own site? <a href="https://squarre.vercel.app" target="_blank">This site was made using Squarre</a></p>
  </footer>

  <script>
    // Navbar scroll
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('scrolled', window.scrollY > 60);
    });

    // Burger menu
    const burger = document.getElementById('burger');
    const navLinks = document.getElementById('navLinks');
    burger.addEventListener('click', () => {
      burger.classList.toggle('open');
      navLinks.classList.toggle('open');
    });
    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        burger.classList.remove('open');
        navLinks.classList.remove('open');
      });
    });
  </script>
  <script>
    (async () => {
      const SITE_ID = "{{SQUARRE_SITE_ID}}";
      if (!SITE_ID || SITE_ID === "{{SQUARRE_SITE_ID}}") return;

      // ── Device ────────────────────────────────────────────────────
      const ua = navigator.userAgent;
      const device =
        /Mobi|Android/i.test(ua) && !/Tablet|iPad/i.test(ua) ? "mobile"
        : /Tablet|iPad/i.test(ua) || (/Android/i.test(ua) && !/Mobile/i.test(ua)) ? "tablet"
        : /Win|Mac|Linux|CrOS/i.test(navigator.platform) ? "desktop"
        : "unknown";

      // ── Visitor hash ──────────────────────────────────────────────
      let hash = localStorage.getItem("visitor_hash");
      if (!hash) {
        hash = crypto.randomUUID();
        localStorage.setItem("visitor_hash", hash);
      }

      // ── Location ──────────────────────────────────────────────────
      let city = null, province = null, country = null;
      try {
        const geoRes = await fetch("https://ipapi.co/json/");
        if (geoRes.ok) {
          const geo = await geoRes.json();
          city     = geo.city          ?? null;
          province = geo.region        ?? null;
          country  = geo.country_name  ?? null;
        }
      } catch {}

      // ── Record visit — capture row id for later updates ───────────
      let visitId = null;
      const startTime = Date.now();

      try {
        const res = await fetch(
          "https://suwiamrsjmbvhceqxchp.supabase.co/rest/v1/site_visits",
          {
            method: "POST",
            headers: {
              apikey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1d2lhbXJzam1idmhjZXF4Y2hwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ5NDM4MDEsImV4cCI6MjA4MDUxOTgwMX0.4V8Ec8pvDYZyM0WYO3ePMa7yrHTuvbVdoCK9eYhH6zk",
              Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1d2lhbXJzam1idmhjZXF4Y2hwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ5NDM4MDEsImV4cCI6MjA4MDUxOTgwMX0.4V8Ec8pvDYZyM0WYO3ePMa7yrHTuvbVdoCK9eYhH6zk",
              "Content-Type": "application/json",
              Prefer: "return=representation,resolution=ignore-duplicates",
            },
            body: JSON.stringify({
              site_id: SITE_ID,
              visitor_hash: hash,
              device,
              city,
              province,
              country,
            }),
          }
        );

        if (res.ok) {
          const rows = await res.json();
          if (rows?.length > 0) visitId = rows[0].id;
        }
      } catch {}

      // ── Engagement tracking ───────────────────────────────────────
      let engaged = false;

      const markEngaged = () => {
        if (engaged || !visitId) return;
        engaged = true;

        navigator.sendBeacon(
          `https://suwiamrsjmbvhceqxchp.supabase.co/rest/v1/site_visits?id=eq.${visitId}`,
          new Blob(
            [JSON.stringify({ engaged: true })],
            { type: "application/json" }
          )
        );
      };

      window.addEventListener("scroll", () => {
        const pct = window.scrollY / (document.body.scrollHeight - window.innerHeight);
        if (pct > 0.3) markEngaged();
      }, { passive: true });

      document.addEventListener("click", markEngaged, { once: true });

      // ── Duration tracking ─────────────────────────────────────────
      let durationSent = false;

      const sendDuration = () => {
        if (durationSent || !visitId) return;
        durationSent = true;

        const duration = Math.round((Date.now() - startTime) / 1000);
        if (duration < 1) return;

        navigator.sendBeacon(
          `https://suwiamrsjmbvhceqxchp.supabase.co/rest/v1/site_visits?id=eq.${visitId}`,
          new Blob(
            [JSON.stringify({ duration_seconds: duration })],
            { type: "application/json" }
          )
        );
      };

      window.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") sendDuration();
      });
      window.addEventListener("pagehide", sendDuration);

    })();
    </script>
    <script>
      const SITE_ID = "{{SQUARRE_SITE_ID}}";
      const SUPABASE_URL = "https://suwiamrsjmbvhceqxchp.supabase.co";
      const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1d2lhbXJzam1idmhjZXF4Y2hwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ5NDM4MDEsImV4cCI6MjA4MDUxOTgwMX0.4V8Ec8pvDYZyM0WYO3ePMa7yrHTuvbVdoCK9eYhH6zk";
      const FUNCTIONS_URL = `${SUPABASE_URL}/functions/v1`;

      // ── Session management ──────────────────────────────────────────
      const session = {
        get() {
          const raw = localStorage.getItem(`session_${SITE_ID}`);
          if (!raw) return null;
          const data = JSON.parse(raw);
          if (new Date(data.expires_at) < new Date()) {
            localStorage.removeItem(`session_${SITE_ID}`);
            return null;
          }
          return data;
        },
        set(data) {
          localStorage.setItem(`session_${SITE_ID}`, JSON.stringify(data));
        },
        clear() {
          localStorage.removeItem(`session_${SITE_ID}`);
        },
      };

      // ── Auth ────────────────────────────────────────────────────────
      async function register(email, password, firstName, lastName) {
        const res = await fetch(`${FUNCTIONS_URL}/customer-register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            site_id: SITE_ID,
            email,
            password,
            first_name: firstName,
            last_name: lastName,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        session.set({ token: data.token, customer: data.customer, expires_at: data.expires_at });
        return data.customer;
      }

      async function login(email, password) {
        const res = await fetch(`${FUNCTIONS_URL}/customer-login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ site_id: SITE_ID, email, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        session.set({ token: data.token, customer: data.customer, expires_at: data.expires_at });
        return data.customer;
      }

      function logout() {
        session.clear();
        updateAuthUI();
      }

      // ── Cart ────────────────────────────────────────────────────────
      async function addToCart(productId, quantity = 1) {
        const s = session.get();
        if (!s) { showLoginModal(); return; }

        await fetch(`${SUPABASE_URL}/rest/v1/cart_items`, {
          method: "POST",
          headers: {
            apikey: ANON_KEY,
            Authorization: `Bearer ${ANON_KEY}`,
            "Content-Type": "application/json",
            Prefer: "resolution=merge-duplicates",
          },
          body: JSON.stringify({
            site_id: SITE_ID,
            customer_id: s.customer.id,
            product_id: productId,
            quantity,
          }),
        });

        updateCartCount();
      }

      async function getCart() {
        const s = session.get();
        if (!s) return [];

        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/cart_items?select=*,products(*)&customer_id=eq.${s.customer.id}&site_id=eq.${SITE_ID}`,
          {
            headers: {
              apikey: ANON_KEY,
              Authorization: `Bearer ${ANON_KEY}`,
            },
          }
        );
        return res.json();
      }

      async function removeFromCart(cartItemId) {
        await fetch(`${SUPABASE_URL}/rest/v1/cart_items?id=eq.${cartItemId}`, {
          method: "DELETE",
          headers: {
            apikey: ANON_KEY,
            Authorization: `Bearer ${ANON_KEY}`,
          },
        });
        renderCart();
      }

      async function updateCartCount() {
        const cart = await getCart();
        const countEl = document.getElementById("cart-count");
        if (countEl) countEl.textContent = cart.length;
      }

      // ── Checkout ────────────────────────────────────────────────────
      async function checkout(shippingAddress) {
        const s = session.get();
        if (!s) { showLoginModal(); return; }

        const res = await fetch(`${FUNCTIONS_URL}/customer-checkout`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            site_id: SITE_ID,
            session_token: s.token,
            shipping_address: shippingAddress,
          }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        // Redirect to PayFast
        window.location.href = data.paymentUrl;
      }

      // ── UI helpers ──────────────────────────────────────────────────
      function updateAuthUI() {
        const s = session.get();
        const loggedInEls = document.querySelectorAll("[data-auth='logged-in']");
        const loggedOutEls = document.querySelectorAll("[data-auth='logged-out']");
        const nameEls = document.querySelectorAll("[data-customer='name']");

        loggedInEls.forEach(el => el.style.display = s ? "" : "none");
        loggedOutEls.forEach(el => el.style.display = s ? "none" : "");
        nameEls.forEach(el => el.textContent = s ? s.customer.first_name : "");
      }

      function showLoginModal() {
        const modal = document.getElementById("login-modal");
        if (modal) modal.style.display = "flex";
      }

      // ── Init ────────────────────────────────────────────────────────
      document.addEventListener("DOMContentLoaded", () => {
        updateAuthUI();
        updateCartCount();
      });
    </script>
</body>
